<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GLITCH — Admin Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-box {
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border: 1px solid #222;
            border-radius: 16px;
            background: #0b0b0b;
            box-shadow: 0 0 25px rgba(0, 140, 255, 0.15);
        }

        .login-box img {
            display: block;
            width: 150px;
            margin: 0 auto 30px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 18px;
            font-size: 13px;
        }

        input {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #111;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #168cff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #168cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #error {
            margin-top: 15px;
            color: #ff4444;
            text-align: center;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <img src="Logo.png" alt="GLITCH">

        <h1>ADMIN LOGIN</h1>

        <form id="loginForm">

            <label>
                EMAIL

                <input
                    type="email"
                    id="email"
                    required
                >
            </label>

            <label>
                PASSWORD

                <input
                    type="password"
                    id="password"
                    required
                >
            </label>

            <button type="submit" id="loginBtn">
                LOGIN
            </button>

            <div id="error"></div>

        </form>

    </div>

    <script type="module" src="./login.js"></script>

</body>

</html>
